name: Deploy backend (Supabase)

# Runs whenever the backend changes, so the Edge Function and database
# migrations deploy automatically on push — no manual `supabase` step, and no
# risk of the frontend going live before the backend catches up.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ajpvlyizqzgtjlroeqdf
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Push database migrations
        run: supabase db push
      - name: Deploy Edge Function
        run: supabase functions deploy api --project-ref "$PROJECT_REF"
