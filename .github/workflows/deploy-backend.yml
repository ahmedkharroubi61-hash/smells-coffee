name: Deploy backend (Supabase)

# Runs whenever the backend changes, so the Edge Function and database
# migrations deploy automatically on push. If the Supabase secrets aren't set,
# every deploy step is skipped (the run stays green) — so it never shows a red
# failure just because you haven't opted into auto-deploy.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ajpvlyizqzgtjlroeqdf
    steps:
      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN not set — skipping backend auto-deploy."
            echo "Add SUPABASE_ACCESS_TOKEN + SUPABASE_DB_PASSWORD as repo secrets to enable it."
          fi
      - uses: actions/checkout@v4
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
      - uses: supabase/setup-cli@v1
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        with:
          version: latest
      # The function deploy needs only the access token + project ref.
      - name: Deploy Edge Function
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        run: supabase functions deploy api --project-ref "$PROJECT_REF"
      # Migrations need a DB connection, so they run only if the DB password is
      # also set; otherwise push them manually with `supabase db push`.
      - name: Push database migrations
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_DB_PASSWORD != '' }}
        run: |
          supabase link --project-ref "$PROJECT_REF"
          supabase db push
