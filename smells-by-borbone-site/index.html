<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Security: Content-Security-Policy locks down what the page may load.
         scripts: only our own bundle (no inline/eval). styles: self + inline
         (the app injects <style>). images/fonts: self + data URIs. network
         (connect): only our Supabase backend. frames: only the Google Maps
         embed. Everything else is denied. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://ajpvlyizqzgtjlroeqdf.supabase.co; frame-src https://maps.google.com https://www.google.com; worker-src 'self'; manifest-src 'self'; form-action 'self'; upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <meta name="theme-color" content="#182B55" />

    <!-- Installable web app (Add to Home Screen) — required for push on iOS 16.4+ -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SmellS" />

    <title>SmellS | Carte du Café Italien</title>
    <meta
      name="description"
      content="La carte digitale de SmellS : espresso, cappuccino, petit-déjeuner, desserts et spécialités italiennes, dans une atmosphère élégante et authentique."
    />

    <!-- Open Graph (Facebook, WhatsApp, Instagram, LinkedIn link previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SmellS" />
    <meta property="og:title" content="SmellS | Café Italien à Sousse" />
    <meta
      property="og:description"
      content="Espresso, iced coffee, smoothies, frappuccino et desserts italiens. Découvrez notre carte — Av. des Orangers, Khzema, Sousse."
    />
    <meta property="og:url" content="https://smellscoffee.com" />
    <meta property="og:image" content="https://smellscoffee.com/og-image.png" />
    <meta property="og:image:width" content="447" />
    <meta property="og:image:height" content="447" />
    <meta property="og:locale" content="fr_FR" />

    <!-- Twitter / X card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="SmellS | Café Italien à Sousse" />
    <meta
      name="twitter:description"
      content="Espresso, iced coffee, smoothies, frappuccino et desserts italiens. Découvrez notre carte."
    />
    <meta name="twitter:image" content="https://smellscoffee.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
